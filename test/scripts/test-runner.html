<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMGameChain — 脚本测试运行器</title>
  <style>
    :root {
      --bg: #0c0c1e;
      --surface: rgba(24, 24, 56, 0.9);
      --text: #ececf0;
      --text-secondary: #a0a0ba;
      --pass: #4ecb71;
      --fail: #ff6b6b;
      --border: rgba(255,255,255,0.08);
      --radius: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .suite {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .suite-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.2s;
    }
    .suite-header:hover { background: rgba(255,255,255,0.03); }
    .suite-header.open { border-bottom-color: var(--border); }
    .suite-name {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suite-stats {
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .stat-pass { color: var(--pass); font-weight: 600; }
    .stat-fail { color: var(--fail); font-weight: 600; }
    .stat-pending { color: var(--text-secondary); }
    .suite-arrow {
      font-size: 11px;
      transition: transform 0.2s;
      color: var(--text-secondary);
    }
    .suite-header.open .suite-arrow { transform: rotate(90deg); }
    .suite-body { display: none; }
    .suite-body.open { display: block; }
    .result-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 18px;
      font-size: 13px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .result-row:last-child { border-bottom: none; }
    .result-icon { flex-shrink: 0; width: 18px; font-size: 13px; line-height: 1.6; }
    .result-icon.pass { color: var(--pass); }
    .result-icon.fail { color: var(--fail); }
    .result-desc { flex: 1; color: var(--text-secondary); }
    .result-row.fail .result-desc { color: var(--text); }
    .result-expected {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .result-expected span {
      color: var(--pass);
      margin-right: 12px;
    }
    .result-expected .got { color: var(--fail); }
    .summary-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .summary-total { font-weight: 700; font-size: 24px; }
    .summary-pass { color: var(--pass); font-weight: 600; }
    .summary-fail { color: var(--fail); font-weight: 600; }
    .summary-divider { width: 1px; height: 28px; background: var(--border); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn:active { transform: scale(0.97); }
    .actions { display: flex; gap: 8px; margin-bottom: 20px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.pass { background: var(--pass); }
    .status-dot.fail { background: var(--fail); }
    .status-dot.pending { background: var(--text-secondary); }
  </style>
</head>
<body>
  <h1>🧪 GMGameChain 脚本测试</h1>
  <p class="subtitle">纯逻辑单元测试 — 无需游戏运行，在浏览器中直接执行</p>

  <div class="summary-bar" id="summary">
    <span class="stat-pending">⏳ 等待运行…</span>
  </div>

  <div class="actions">
    <button class="btn" id="btn-run-all">▶ 运行全部测试</button>
    <button class="btn" id="btn-collapse-all">📁 折叠全部</button>
  </div>

  <div id="suites"></div>

  <script type="module">
    import { run as runGridUtils } from './test-gridUtils.js';
    import { run as runEventBus } from './test-eventBus.js';
    import { run as runStore } from './test-store.js';
    import { run as runConfig } from './test-config-validation.js';

    const suitesEl = document.getElementById('suites');
    const summaryEl = document.getElementById('summary');
    const suites = [];

    function formatSuite(suiteResult) {
      // suiteResult: { name, passed, failed, total, results[] }
      const allPass = suiteResult.failed === 0;
      const statusClass = allPass ? 'pass' : 'fail';
      const statusIcon = allPass ? '✅' : '❌';

      const html = `
        <div class="suite" data-name="${suiteResult.name}">
          <div class="suite-header open" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open')">
            <span class="suite-name">
              <span class="suite-arrow">▶</span>
              ${statusIcon} ${suiteResult.name}
            </span>
            <span class="suite-stats">
              <span class="stat-pass">✓ ${suiteResult.passed}</span>
              ${suiteResult.failed > 0 ? `<span class="stat-fail">✗ ${suiteResult.failed}</span>` : ''}
            </span>
          </div>
          <div class="suite-body open">
            ${suiteResult.results.map(r => `
              <div class="result-row ${r.pass ? '' : 'fail'}">
                <span class="result-icon ${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'}</span>
                <div>
                  <div class="result-desc">${r.description}</div>
                  ${!r.pass ? `<div class="result-expected"><span>期望: ${r.expected}</span><span class="got">实际: ${r.actual}</span></div>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      return html;
    }

    function updateSummary(totalPassed, totalFailed, totalCount) {
      const allPass = totalFailed === 0;
      summaryEl.innerHTML = `
        <span class="status-dot ${allPass ? 'pass' : 'fail'}"></span>
        <span class="summary-total">${totalCount}</span> 项测试
        <span class="summary-divider"></span>
        <span class="summary-pass">✓ ${totalPassed} 通过</span>
        <span class="summary-fail">✗ ${totalFailed} 失败</span>
      `;
    }

    async function runAll() {
      summaryEl.innerHTML = '<span class="stat-pending">⏳ 运行中…</span>';
      const btn = document.getElementById('btn-run-all');
      btn.textContent = '⏳ 运行中…';
      btn.disabled = true;

      // 先运行同步测试
      const syncSuites = [runGridUtils(), runEventBus(), runStore()];
      // 异步测试（需要 fetch 加载 config）
      const asyncSuite = runConfig();

      let html = '';
      let totalPassed = 0;
      let totalFailed = 0;
      let totalCount = 0;

      for (const suite of syncSuites) {
        html += formatSuite(suite);
        totalPassed += suite.passed;
        totalFailed += suite.failed;
        totalCount += suite.total;
      }

      // 运行异步 config 测试
      try {
        const configResult = await asyncSuite;
        html += formatSuite(configResult);
        totalPassed += configResult.passed;
        totalFailed += configResult.failed;
        totalCount += configResult.total;
      } catch (e) {
        html += `
          <div class="suite" data-name="Config Validation">
            <div class="suite-header" style="cursor:default">
              <span class="suite-name">❌ Config Validation</span>
              <span class="suite-stats"><span class="stat-fail">加载失败</span></span>
            </div>
            <div class="suite-body open">
              <div class="result-row fail">
                <span class="result-icon fail">✗</span>
                <div>
                  <div class="result-desc">无法运行 Config 测试: ${e.message}</div>
                  <div class="result-expected"><span>请确保通过 HTTP 服务器访问此页面</span></div>
                </div>
              </div>
            </div>
          </div>`;
        totalFailed++;
        totalCount++;
      }

      suitesEl.innerHTML = html;
      updateSummary(totalPassed, totalFailed, totalCount);

      btn.textContent = '🔄 重新运行';
      btn.disabled = false;
    }

    // 初始状态：显示各模块待运行
    function showPending() {
      const names = ['gridUtils', 'EventBus', 'Store', 'Config Validation'];
      suitesEl.innerHTML = names.map(n => `
        <div class="suite" data-name="${n}">
          <div class="suite-header" style="cursor:default">
            <span class="suite-name"><span class="suite-arrow" style="visibility:hidden">▶</span> <span class="status-dot pending"></span> ${n}</span>
            <span class="suite-stats"><span class="stat-pending">待运行</span></span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('btn-run-all').addEventListener('click', runAll);
    document.getElementById('btn-collapse-all').addEventListener('click', () => {
      const headers = document.querySelectorAll('.suite-header');
      const bodies = document.querySelectorAll('.suite-body');
      const allOpen = [...bodies].every(b => b.classList.contains('open'));
      headers.forEach(h => h.classList.toggle('open', !allOpen));
      bodies.forEach(b => b.classList.toggle('open', !allOpen));
      document.getElementById('btn-collapse-all').textContent = allOpen ? '📂 展开全部' : '📁 折叠全部';
    });

    // 初始化
    showPending();
  </script>
</body>
</html>
