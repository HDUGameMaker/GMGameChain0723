<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>⚔️</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GMGameChain - 模拟经营</title>
  <style>
    /* ===== CSS 设计令牌 ===== */
    :root {
      /* 底色 */
      --bg-deep: #0c0c1e;
      --bg-canvas: #14142b;
      --bg-surface: rgba(24, 24, 56, 0.85);
      --bg-card: rgba(32, 32, 64, 0.7);
      --bg-card-hover: rgba(40, 40, 78, 0.8);

      /* 文字 */
      --text-primary: #ececf0;
      --text-secondary: #a0a0ba;
      --text-muted: #6a6a82;
      --text-danger: #ff6b6b;
      --text-warning: #ffb347;

      /* 强调色 */
      --accent-blue: #5b8def;
      --accent-amber: #f0a040;
      --accent-green: #4ecb71;
      --accent-cyan: #4ec9c1;
      --accent-purple: #8b7cf0;

      /* 边框 */
      --border-subtle: rgba(255,255,255,0.06);
      --border-normal: rgba(255,255,255,0.1);
      --border-glow: rgba(91, 141, 239, 0.3);

      /* 圆角 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;

      /* 阴影 */
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 20px rgba(91, 141, 239, 0.15);

      /* 字体 */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

      /* 顶部 HUD 占位：顶部浮层统一引用，避免和资源栏重叠 */
      --hud-top-block-height: 89px;
      --hud-top-padding-y: max(10px, env(safe-area-inset-top));
      --hud-top-offset: calc(var(--hud-top-padding-y) + var(--hud-top-block-height) + 12px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: var(--font-sans);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #game-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      /* 2D / 3D 切换过渡动画 */
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 3D 透视：模拟俯视角桌游效果 */
    #game-canvas.perspective-3d {
      transform: perspective(1200px) rotateX(50deg);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    #game-canvas canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ===== HUD 浮层 ===== */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #hud > * {
      pointer-events: auto;
    }

    /* ===== 顶部栏 ===== */
    #hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: var(--hud-top-padding-y) 12px 12px;
      background: #111126;
      gap: 8px;
    }

    #resource-bar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      overflow-x: auto;
      flex: 1;
      padding: 0;
      scrollbar-width: none;
    }

    #resource-bar::-webkit-scrollbar {
      display: none;
    }

    .resource-cluster {
      display: flex;
      align-items: center;
      padding: 7px;
      box-sizing: border-box;
      height: var(--hud-top-block-height);
      border: 1px solid #2d2d4b;
      border-radius: 14px;
      background: #191932;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      flex-shrink: 0;
    }

    .resource-cluster-items {
      display: grid;
      align-items: center;
      grid-auto-rows: 34px;
      gap: 5px;
    }

    .resource-cluster.primary .resource-cluster-items {
      grid-template-columns: repeat(3, minmax(76px, auto));
    }

    .resource-cluster.secondary .resource-cluster-items {
      grid-template-columns: repeat(4, minmax(76px, auto));
    }

    .resource-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-subtle);
      min-width: 76px;
      min-height: 34px;
      justify-content: space-between;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: border-color 0.2s, background 0.2s;
    }

    .resource-item:hover {
      border-color: var(--border-normal);
      background: var(--bg-card-hover);
    }

    .resource-item:active {
      transform: scale(0.95);
    }

    .resource-item.full {
      color: var(--text-danger);
      border-color: rgba(255, 107, 107, 0.3);
    }

    .res-icon,
    .res-icon-wrap img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      vertical-align: middle;
      display: block;
    }

    .res-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
    }

    .res-main {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .res-delta {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 22px;
      margin-left: 8px;
      text-align: right;
      flex-shrink: 0;
    }

    .res-rate {
      font-size: 10px;
      font-weight: 500;
      opacity: 0.75;
      margin-left: 1px;
      letter-spacing: -0.02em;
    }
    .res-rate.positive {
      color: var(--accent-green);
    }
    .res-rate.negative {
      color: var(--text-danger);
    }

    #hud-info {
      display: flex;
      align-items: stretch;
      gap: 8px;
      flex-shrink: 0;
      height: var(--hud-top-block-height);
    }

    #time-display {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      box-sizing: border-box;
      height: var(--hud-top-block-height);
      padding: 9px 12px;
      border-radius: 14px;
      background: #191932;
      border: 1px solid #2d2d4b;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .time-weather-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      width: 100%;
    }

    .time-weather-line .warning {
      color: var(--text-warning);
    }

    .time-weather-line .danger {
      color: var(--text-danger);
    }

    #weather-display {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      cursor: default;
    }

    #viewport-center-display {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      box-sizing: border-box;
      height: var(--hud-top-block-height);
      min-width: 68px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #191932;
      border: 1px solid #2d2d4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      cursor: default;
    }

    #viewport-center-display .vc-label {
      color: var(--text-muted);
      font-size: 11px;
    }

    #viewport-center-display .vc-coord {
      color: var(--accent);
    }

    .vc-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }

    #hud-actions {
      box-sizing: border-box;
      height: var(--hud-top-block-height);
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .hud-btn.hud-btn-top {
      width: 42px;
      height: 41px;
      min-width: 42px;
      min-height: 0;
      font-size: 16px;
      flex-shrink: 0;
      background: #191932;
      border-color: #2d2d4b;
    }

    /* 暂停状态指示（顶部栏居中） */
    #pause-indicator {
      display: none;
      position: fixed;
      top: var(--hud-top-offset);
      left: 50%;
      transform: translateX(-50%);
      background: #ff4444;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      z-index: 9999;
      letter-spacing: 0.05em;
      box-shadow: 0 0 16px rgba(255,68,68,0.5);
      animation: pause-pulse 1.5s ease-in-out infinite;
    }
    #pause-indicator.visible { display: block; }

    /* 运行时生成的战役状态条始终位于完整顶部 HUD 下方。 */
    .territory-status { top: var(--hud-top-offset) !important; }
    .enemy-status { top: calc(var(--hud-top-offset) + 30px) !important; }

    @keyframes pause-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ===== 底部操作栏 ===== */
    #hud-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(12,12,30,0.85) 0%, rgba(12,12,30,0.4) 70%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .hud-spacer { flex: 1; min-width: 40px; }

    .hud-btn {
      min-width: 48px;
      height: 48px;
      padding: 4px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s, border-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .hud-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-normal);
    }

    .hud-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.2);
      box-shadow: var(--shadow-glow);
    }

    .hud-btn.disabled {
      opacity: 0.25;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    .hud-btn.hidden {
      display: none;
    }
    .hud-btn-icon { font-size: 18px; line-height: 1; }
    .hud-btn-label { font-size: 10px; font-weight: 500; line-height: 1; color: var(--text-muted); }
    .hud-btn-speed { min-width: 48px; padding: 4px 6px; }
    .hud-btn-recruit-group { display: flex; gap: 2px; }
    .hud-btn-recruit-group .hud-btn { min-width: 44px; padding: 4px 7px; border-radius: var(--radius-md); }
    .hud-btn-recruit-group .hud-btn:first-child { border-radius: var(--radius-md) 3px 3px var(--radius-md); }
    .hud-btn-recruit-group .hud-btn:last-child { border-radius: 3px var(--radius-md) var(--radius-md) 3px; }
    .hud-btn-feature {
      border-color: rgba(214, 168, 75, 0.6);
      background: linear-gradient(180deg, rgba(214,168,75,0.14), var(--bg-card));
      box-shadow: inset 0 0 0 1px rgba(214,168,75,0.08);
    }

    #population-display {
      color: var(--text-primary); font-size:13px; font-weight:600; cursor:pointer;
      box-sizing:border-box; height:var(--hud-top-block-height); padding:8px 12px;
      border-radius:14px; background:#191932; border:1px solid #2d2d4b;
      min-width:176px; display:flex; flex-direction:column; justify-content:center; gap:8px;
    }
    .population-line,.military-line { display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%; }
    .hud-info-main { color:var(--text-primary);font-weight:700;white-space:nowrap; }
    .hud-info-sub { color:var(--text-muted);font-size:10px;font-weight:600;white-space:nowrap; }
    #population-display .bottleneck { color:var(--text-warning); }
    .hud-btn-feature .hud-btn-label { color: #efd58c; font-weight: 700; }

    /* ===== 挪动模式切换按钮（右下角）===== */
    #move-mode-toggle {
      position: absolute;
      bottom: 80px;
      right: 16px;
      z-index: 1000;
    }
    #btn-move-mode {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    #btn-move-mode:hover {
      background: var(--bg-card-hover);
    }
    #btn-move-mode.active {
      border-color: rgba(240, 160, 64, 0.5);
      background: rgba(240, 160, 64, 0.15);
      color: #f0a040;
    }

    /* ===== 入侵通知（屏幕正左侧）===== */
    #invasion-widget {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1001;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: rgba(200,40,40,0.12);
      border: 1px solid rgba(255,80,80,0.25);
      border-left: none;
      border-radius: 0 12px 12px 0;
      backdrop-filter: blur(8px);
      max-width: 220px;
      animation: slideInLeft 0.3s ease;
    }
    @keyframes slideInLeft {
      from { transform: translateY(-50%) translateX(-100%); opacity: 0; }
      to { transform: translateY(-50%) translateX(0); opacity: 1; }
    }
    #invasion-widget.active { display: flex; }
    #invasion-widget.idle { border-color: rgba(78,203,113,0.25); background: rgba(78,203,113,0.08); }
    #invasion-widget.idle .invasion-title { color: #4ecb71; }
    #invasion-widget.alarm { border-color: rgba(255,80,80,0.25); background: rgba(200,40,40,0.12); }
    #invasion-widget.alarm .invasion-title { color: #ff6b6b; }
    .invasion-title { font-size: 14px; font-weight: 700; color: #ff6b6b; }
    .invasion-stat { font-size: 12px; color: #e0e0e8; margin: 2px 0; }
    .invasion-btn {
      padding: 8px 14px; border: none; border-radius: 8px;
      background: rgba(255,107,107,0.2); color: #ff6b6b;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: background 0.2s;
      text-align: center; margin-top: 4px;
    }
    .invasion-btn:hover { background: rgba(255,107,107,0.35); }
    .invasion-army-btn {
      padding: 5px 10px; border: none; border-radius: 5px;
      background: rgba(78,203,113,0.15); color: #4ecb71;
      cursor: pointer; font-size: 11px; font-weight: 500;
      transition: background 0.2s; margin: 2px 0;
    }
    .invasion-army-btn:hover { background: rgba(78,203,113,0.3); }
    .invasion-army-btn.disabled { opacity: 0.4; cursor: default; }
    #invasion-army-list { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }

    /* ===== 弹窗系统 ===== */
    #popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1200;
    }

    #popup-overlay.active {
      display: flex;
    }

    #popup-container {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-normal);
      width: 95vw;
      max-width: 1400px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* 英雄交互采用稳定的阅读宽度，避免 4K 屏上横向留白无限扩张。 */
    #popup-container[data-popup-type="hero_interaction"] {
      width: min(94vw, 820px);
      max-width: 820px;
      max-height: 92vh;
    }
    #popup-container[data-popup-type="hero_interaction"] #popup-body {
      flex: 0 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    /* 依据屏幕实际像素分档放大交互控件，保持不同分辨率下接近的视觉尺寸。 */
    html[data-ui-density="high"] .hud-btn {
      min-width: 58px;
      height: 58px;
      padding: 5px 12px;
    }
    html[data-ui-density="high"] .hud-btn-icon { font-size: 23px; }
    html[data-ui-density="high"] .hud-btn-label { font-size: 12px; }
    html[data-ui-density="high"] .res-icon,
    html[data-ui-density="high"] .res-icon-wrap img { width: 25px; height: 25px; }
    html[data-ui-density="high"] .res-icon-wrap { min-width: 25px; }
    html[data-ui-density="high"] .resource-item { min-height: 40px; font-size: 15px; }
    html[data-ui-density="high"] #popup-header { padding: 17px 20px; }
    html[data-ui-density="high"] #popup-back-btn,
    html[data-ui-density="high"] #popup-close-btn { width: 44px; height: 44px; font-size: 18px; }
    html[data-ui-density="high"] #popup-title { font-size: 19px; }

    html[data-ui-density="ultra"] .hud-btn {
      min-width: 68px;
      height: 68px;
      padding: 6px 14px;
    }
    html[data-ui-density="ultra"] .hud-btn-icon { font-size: 28px; }
    html[data-ui-density="ultra"] .hud-btn-label { font-size: 14px; }
    html[data-ui-density="ultra"] .res-icon,
    html[data-ui-density="ultra"] .res-icon-wrap img { width: 30px; height: 30px; }
    html[data-ui-density="ultra"] .res-icon-wrap { min-width: 30px; }
    html[data-ui-density="ultra"] .resource-item { min-height: 48px; font-size: 17px; }
    html[data-ui-density="ultra"] #popup-header { padding: 20px 24px; }
    html[data-ui-density="ultra"] #popup-back-btn,
    html[data-ui-density="ultra"] #popup-close-btn { width: 52px; height: 52px; font-size: 22px; }
    html[data-ui-density="ultra"] #popup-title { font-size: 23px; }

    @media (max-width: 760px), (max-height: 620px) {
      #popup-container[data-popup-type="hero_interaction"] { width: 96vw; }
      #popup-container[data-popup-type="hero_interaction"] #popup-body { min-height: 0 !important; }
    }

    #popup-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 8px;
      background: rgba(255,255,255,0.02);
    }

    #popup-back-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    #popup-back-btn:hover {
      background: rgba(255,255,255,0.12);
      color: var(--text-primary);
    }

    #popup-title {
      flex: 1;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    #popup-close-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    #popup-close-btn:hover {
      background: rgba(255, 107, 107, 0.2);
      color: var(--text-danger);
      border-color: rgba(255, 107, 107, 0.3);
    }

    #popup-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* 滚动条美化 */
    #popup-body::-webkit-scrollbar {
      width: 4px;
    }
    #popup-body::-webkit-scrollbar-track {
      background: transparent;
    }
    #popup-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    #popup-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      display: none;
      background: rgba(0,0,0,0.15);
    }

    /* ===== Popover/提示 ===== */
    .popover {
      position: fixed;
      background: var(--bg-surface);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      line-height: 1.5;
      z-index: 200;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-normal);
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      letter-spacing: 0.01em;
    }

    /* ===== 探险状态小 HUD（任务悬浮窗下方，预留多队列）===== */
    #expedition-status {
      position: fixed;
      top: calc(var(--hud-top-offset) + 76px);
      right: 12px;
      width: 220px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 1095;
      pointer-events: auto;
    }

    .expedition-card {
      background: #191932;
      color: #fff;
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(91, 141, 239, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .expedition-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(91,141,239,0.14);
    }

    .expedition-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .expedition-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .expedition-pct {
      font-size: 11px;
      color: #9db8ff;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .expedition-meta {
      font-size: 11px;
      color: #9ca0be;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 6px;
    }

    /* ===== 左侧悬浮状态 ===== */
    #left-status-stack {
      position: fixed;
      top: calc(var(--hud-top-offset) + 12px);
      left: 12px;
      width: 230px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1100;
      pointer-events: none;
    }

    #deferred-event-tray {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .deferred-event-card {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 10px;
      border: 1px solid rgba(240,160,64,0.28);
      border-radius: 12px;
      background: #191932;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      pointer-events: auto;
    }

    .deferred-event-card:hover {
      border-color: var(--accent-amber);
      box-shadow: 0 0 12px rgba(240,160,64,0.14);
    }

    .deferred-event-icon {
      flex-shrink: 0;
      font-size: 17px;
      line-height: 1;
    }

    .deferred-event-text {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .deferred-event-name {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .deferred-event-meta {
      font-size: 10px;
      color: var(--text-muted);
    }

    #tech-status {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 12px;
      background: #191932;
      border: 1px solid rgba(91,141,239,0.28);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      pointer-events: auto;
    }

    #tech-status:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(91,141,239,0.14);
    }

    .tech-status-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .tech-status-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tech-status-pct {
      flex-shrink: 0;
      color: #9db8ff;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .tech-status-meta {
      font-size: 10px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== 进度条 ===== */
    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .progress-fill.green  { background: linear-gradient(90deg, #3a9b5c, #5cdb82); }
    .progress-fill.blue   { background: linear-gradient(90deg, #4a85d0, #6cb4f8); }
    .progress-fill.amber  { background: linear-gradient(90deg, #e08820, #f8b840); }
    .progress-fill.cyan   { background: linear-gradient(90deg, #3d9e98, #6cd4ce); }

    /* Tick 进度条 */
    .tick-progress {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tick-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 2px;
    }

    /* 建造进度条 */
    .build-progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .build-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-amber), #fc0);
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    /* 面板内进度条容器 */
    .panel-progress-section {
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .panel-progress-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* ===== 消息播报系统 ===== */
    #msg-log-container {
      position: absolute;
      top: calc(var(--hud-top-offset) + 12px);
      left: 0;
      right: 0;
      bottom: 80px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 5;
    }

    .msg-log-side {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    #msg-log-left {
      align-items: flex-start;
    }

    #msg-log-right {
      align-items: flex-end;
    }

    .msg-item {
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: auto;
      box-shadow: var(--shadow-sm);
    }

    /* 存档诊断必须完整显示字段路径，不能被普通播报的省略号截断。 */
    .msg-item.diagnostic {
      width: max-content;
      max-width: min(560px, calc(100vw - 24px));
      overflow: visible;
      overflow-wrap: anywhere;
      text-overflow: clip;
      white-space: normal;
      text-align: left;
      line-height: 1.55;
    }

    .msg-item.left {
      background: linear-gradient(135deg, rgba(78, 203, 113, 0.2), rgba(78, 203, 113, 0.08));
      border: 1px solid rgba(78, 203, 113, 0.25);
      color: var(--accent-green);
      text-align: left;
    }

    .msg-item.right {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 107, 107, 0.08));
      border: 1px solid rgba(255, 107, 107, 0.25);
      color: var(--text-danger);
      text-align: right;
    }

    /* ===== Debug 调试面板 ===== */
    #debug-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      max-width: 90vw;
      height: 100%;
      background: rgba(16, 16, 40, 0.95);
      border-left: 1px solid var(--border-normal);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
    }

    #debug-panel.visible {
      right: 0;
    }

    .debug-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.03);
    }

    .debug-panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.02em;
      font-family: var(--font-sans);
    }

    .debug-panel-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }

    .debug-panel-close:hover {
      background: rgba(255, 107, 107, 0.2);
      color: var(--text-danger);
    }

    .debug-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .debug-panel-body::-webkit-scrollbar {
      width: 4px;
    }
    .debug-panel-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .debug-panel-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .debug-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .debug-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      font-family: var(--font-sans);
    }

    .debug-fps {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-green);
      font-family: var(--font-mono);
    }

    .debug-row {
      padding: 3px 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .debug-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .debug-res-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      font-size: 11px;
    }

    .debug-res-name {
      color: var(--text-muted);
      min-width: 60px;
      flex-shrink: 0;
    }

    .debug-res-val {
      color: var(--text-primary);
      font-weight: 600;
      min-width: 70px;
      text-align: right;
      flex-shrink: 0;
    }

    .debug-res-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .debug-res-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .debug-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .debug-btn {
      padding: 6px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .debug-btn:hover {
      background: rgba(91, 141, 239, 0.15);
      border-color: rgba(91, 141, 239, 0.3);
      color: var(--text-primary);
    }

    .debug-btn:active {
      background: rgba(91, 141, 239, 0.25);
      transform: scale(0.96);
    }

    /* ===== 事件面板增强 ===== */
    .event-panel-header {
      text-align: center;
      margin-bottom: 16px;
    }
    .event-panel-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .event-panel-divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      border-radius: 2px;
      margin: 12px auto;
      opacity: 0.6;
    }
    .event-option-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-family: var(--font-sans);
      letter-spacing: 0.01em;
      margin-bottom: 8px;
    }
    .event-option-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-glow);
    }
    .event-option-btn:active {
      transform: scale(0.98);
    }
    .event-description {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      white-space: pre-line;
      text-align: center;
      margin-bottom: 16px;
    }
    /* ===== 任务悬浮窗（右侧）===== */
    #quest-widget {
      position: fixed;
      top: calc(var(--hud-top-offset) + 12px);
      right: 12px;
      z-index: 1100;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: opacity 0.3s, transform 0.3s;
      max-width: 220px;
    }
    #quest-widget:hover {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(91,141,239,0.15);
    }
    #quest-widget.hidden { display: none; }
    #quest-widget-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    #quest-widget-text {
      font-size: 12px;
      color: #ececf0;
      line-height: 1.4;
    }
    #quest-widget-text .qw-name {
      font-weight: 600;
      font-size: 13px;
    }
    #quest-widget-text .qw-progress {
      color: #888;
      font-size: 11px;
    }
    /* 红点提示 */
    #quest-widget .qw-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 12px;
      height: 12px;
      background: #ff4444;
      border-radius: 50%;
      border: 2px solid var(--bg-card);
      animation: dot-pulse 2s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }
    /* ===== 窄屏布局：保留完整信息，通过两行 HUD 与横向滚动避免裁切 ===== */
    @media (max-width: 700px) {
      :root {
        --hud-top-block-height: 52px;
        --hud-top-offset: calc(var(--hud-top-padding-y) + 120px);
      }

      #hud-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        padding: var(--hud-top-padding-y) 6px 6px;
      }

      #resource-bar,
      #hud-info {
        width: 100%;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }

      #resource-bar { gap: 6px; }
      #hud-info { height: var(--hud-top-block-height); }
      #resource-bar::-webkit-scrollbar,
      #hud-info::-webkit-scrollbar,
      #hud-bottom::-webkit-scrollbar { display: none; }

      .resource-cluster {
        height: var(--hud-top-block-height);
        padding: 5px;
        border-radius: 10px;
      }

      .resource-cluster-items,
      .resource-cluster.primary .resource-cluster-items,
      .resource-cluster.secondary .resource-cluster-items {
        display: flex;
        gap: 4px;
      }

      .resource-item {
        min-width: 68px;
        min-height: 32px;
        padding: 4px 7px;
        font-size: 12px;
      }

      #population-display,
      #time-display,
      #viewport-center-display {
        height: var(--hud-top-block-height);
        border-radius: 10px;
        padding: 5px 8px;
        gap: 3px;
      }

      #time-display { min-width: 170px; }
      #population-display { min-width:158px; }
      #viewport-center-display { min-width: 62px; }
      .hud-info-sub { font-size:9px; }
      .time-weather-line { flex-direction: row; gap: 5px; }

      #hud-actions {
        height: var(--hud-top-block-height);
        flex-direction: row;
        gap: 5px;
      }

      .hud-btn.hud-btn-top {
        width: 40px;
        height: var(--hud-top-block-height);
      }

      #hud-bottom {
        justify-content: flex-start;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-inline: 6px;
      }

      #hud-bottom .hud-btn { flex: 0 0 auto; }
      #hud-bottom .hud-spacer { display: none; }
    }

    #map-hover-card {
      position: fixed;
      z-index: 1200;
      width: 300px;
      padding: 14px 16px;
      border: 1px solid rgba(214, 176, 103, 0.68);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(20, 27, 35, 0.97), rgba(9, 14, 20, 0.97));
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.52);
      color: #e9e0cf;
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .12s ease, transform .12s ease;
    }

    #map-hover-card.visible { opacity: 1; transform: translateY(0); }
    .map-hover-card__title { color: #f0c879; font-size: 16px; font-weight: 700; }
    .map-hover-card__subtitle { margin: 2px 0 8px; color: #8fb7c5; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .map-hover-card__line { margin-top: 4px; color: #d4d9dc; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="game-canvas"></div>
  <div id="map-hover-card" role="tooltip" aria-live="polite"></div>

  <div id="hud">
    <div id="hud-top">
      <div id="resource-bar"></div>
      <div id="hud-info">
        <div id="population-display"></div>
        <div id="weather-display"></div>
        <div id="time-display"></div>
        <div id="viewport-center-display" title="当前视角中心所在的网格坐标"></div>
        <div id="hud-actions">
          <button class="hud-btn hud-btn-top" id="btn-settings" title="设置">⚙️</button>
          <button class="hud-btn hud-btn-top" id="btn-fullscreen" title="全屏">⛶</button>
        </div>
      </div>
    </div>

    <!-- 任务悬浮窗 -->
    <div id="quest-widget" class="hidden">
      <div id="quest-widget-icon"></div>
      <div id="quest-widget-text"></div>
    </div>

    <!-- 消息播报系统 -->
    <div id="msg-log-container">
      <div id="msg-log-left" class="msg-log-side"></div>
      <div id="msg-log-right" class="msg-log-side"></div>
    </div>

    <div id="left-status-stack">
      <div id="deferred-event-tray"></div>
      <div id="tech-status"></div>
    </div>

    <div id="expedition-status"></div>

    <div id="hud-bottom">
      <button class="hud-btn" id="btn-era" title="时代与文明"><span class="hud-btn-icon">🏛️</span><span class="hud-btn-label">时代</span></button>
      <button class="hud-btn" id="btn-development-details" title="查看当前发展状态与全部加成"><span class="hud-btn-icon">📊</span><span class="hud-btn-label">发展详情</span></button>
      <button class="hud-btn" id="btn-luxury" title="奢侈品与贸易" style="display:none"><span class="hud-btn-icon">💎</span><span class="hud-btn-label">奢侈品</span></button>
      <button class="hud-btn" id="btn-tech" title="科技"><span class="hud-btn-icon">🔬</span><span class="hud-btn-label">科技</span></button>
      <button class="hud-btn" id="btn-culture" title="文化"><span class="hud-btn-icon">📜</span><span class="hud-btn-label">文化</span></button>
      <button class="hud-btn" id="btn-quest" title="任务"><span class="hud-btn-icon">📋</span><span class="hud-btn-label">任务</span></button>
      <button class="hud-btn" id="btn-objective" title="战役目标"><span class="hud-btn-icon">🎯</span><span class="hud-btn-label">目标</span></button>
      <button class="hud-btn" id="btn-build" title="建设"><span class="hud-btn-icon">🏗️</span><span class="hud-btn-label">建设</span></button>
      <button class="hud-btn" id="btn-army" title="军队"><span class="hud-btn-icon">⚔️</span><span class="hud-btn-label">军队</span></button>
      <button class="hud-btn" id="btn-assembly" title="打开大本营军团集结"><span class="hud-btn-icon">🧭</span><span class="hud-btn-label">集结</span></button>
      <button class="hud-btn" id="btn-unit-research" title="兵种研发：解锁新的士兵种类"><span class="hud-btn-icon">🛡️</span><span class="hud-btn-label">兵种研发</span></button>
      <button class="hud-btn" id="btn-heroes" title="英雄名册：建设酒馆后可招募英雄"><span class="hud-btn-icon">🍺</span><span class="hud-btn-label">英雄</span></button>
      <button class="hud-btn" id="btn-cancel-place" title="取消放置" style="display:none">✕</button>
      <div class="hud-spacer"></div>
      <div class="hud-btn-recruit-group" id="btn-recruit-group">
        <button class="hud-btn" id="btn-recruit-1" title="在大本营招募 1 名工人"><span class="hud-btn-icon">👷</span><span class="hud-btn-label">+1</span></button>
        <button class="hud-btn" id="btn-recruit-max" title="尽可能招募工人，直到住房满或食物耗尽"><span class="hud-btn-icon">👷</span><span class="hud-btn-label">招募满</span></button>
      </div>
      <button class="hud-btn" id="btn-fill-workers" title="把空闲工人按顺序填入已有生产建筑"><span class="hud-btn-icon">🛠️</span><span class="hud-btn-label">自动填充</span></button>
      <button class="hud-btn hud-btn-speed" id="btn-speed" title="加速">⏩</button>
      <button class="hud-btn hud-btn-speed" id="btn-pause" title="暂停">⏸</button>
    </div>

    <!-- 挪动模式/常时模式切换 -->
    <div id="move-mode-toggle">
      <button id="btn-move-mode" title="挪动模式">✋ 常时模式</button>
  </div>
</div>

<!-- 入侵通知 -->
<div id="invasion-widget">
  <div class="invasion-title">⚠️ 入侵警报</div>
  <div class="invasion-stat">战斗力: <span id="invasion-power">0</span></div>
  <div style="margin:4px 0;">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#808098;margin-bottom:2px;">
      <span>⏳ 倒计时</span>
      <span id="invasion-timer">1天</span>
    </div>
    <div style="width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">
      <div id="invasion-progress" style="width:0%;height:100%;background:linear-gradient(90deg,#f0a040,#ff6b6b);border-radius:3px;transition:width 1s linear;"></div>
    </div>
  </div>
  <div style="font-size:11px;color:#808098;margin:2px 0;">选择军团出击:</div>
    <div id="invasion-army-list"></div>
  </div>

<div id="popup-overlay">
    <div id="popup-container">
      <div id="popup-header">
        <button id="popup-back-btn">←</button>
        <div id="popup-title"></div>
        <button id="popup-close-btn">✕</button>
      </div>
      <div id="popup-body"></div>
      <div id="popup-footer"></div>
    </div>
  </div>

  <script src="lib/pixi.min.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
